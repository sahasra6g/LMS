spring.application.name=LibraryManagementSystem
server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/LibraryManagementDB}
spring.datasource.username=postgres
spring.datasource.password=#Shu9390
spring.datasource.driver-class-name=org.postgresql.Driver

# The SQL script is provided separately. Hibernate checks mappings but does not create/change tables.
